name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

  test-script:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "18.04"  # Bionic Beaver
          - "20.04"  # Focal Fossa
          - "22.04"  # Jammy Jellyfish
          - "24.04"  # Noble Numbat
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install git and sudo for checkout/script
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git sudo ca-certificates

      - uses: actions/checkout@v4

      - name: Run disableUbuntuOptOut.sh
        run: |
          chmod +x disableUbuntuOptOut.sh
          ./disableUbuntuOptOut.sh

      - name: Verify hosts file entries
        run: |
          grep -q "metrics.ubuntu.com" /etc/hosts
          grep -q "popcon.ubuntu.com" /etc/hosts

      - name: Verify telemetry packages are removed
        run: |
          for pkg in ubuntu-report popularity-contest apport whoopsie apport-symptoms; do
            status=$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null || true)
            if [ "$status" = "install ok installed" ]; then
              echo "[-] $pkg is still installed"
              exit 1
            fi
          done
          echo "[+] All telemetry packages removed"
